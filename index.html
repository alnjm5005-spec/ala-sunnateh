function renderQuran(){

 surahNames.forEach((n,i)=>{html+=`<div class="glass surah-item s-item" data-n="${n}" onclick="openSurah(${i+1})"><div style="display:flex;align-items:center;gap:12px"><div class="surah-num">${i+1}</div><div><div style="font-weight:700;font-size:13.5px">${n}</div><div style="font-size:10.5px;color:#6b7280;margin-top:1px">اضغط للقراءة</div></div></div><div class="arrow">‹</div></div>`;});
 html+=`</div>`;
 document.getElementById('app').innerHTML=html;
}

 let html=`<div class="glass" style="padding:12px;margin-bottom:10px"><input class="search" style="margin:0" placeholder="ابحث في الأذكار..." oninput="filterZ(this.value)"></div>`;
 hisnData.forEach((sec,secIdx)=>{
   html+=`<div class="glass card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><div style="font-size:20px">${sec.icon}</div><div style="font-weight:800;font-size:14px">${sec.title}</div></div>`;
   sec.items.forEach((it,idx)=>{
     const key=`z_${secIdx}_${idx}`; const cur=storage[key]||0; const done=cur>=it.repeat;
     html+=`<div class="zekr-wrap" data-txt="${it.txt.slice(0,15)}"><div class="zekr-text">${it.txt} ${it.repeat>1?`<span style="font-size:10px;color:#6b7280">(${it.repeat})</span>`:''}</div><div class="zekr-actions"><button class="counter-btn ${done?'done':''}" onclick="inc('${key}',${it.repeat})">${done?'✓':'+'}</button><span class="counter-num" id="n_${key}">${cur}/${it.repeat}</span><button class="copy-btn" onclick="copyZ(this)">نسخ</button></div>${it.repeat>1?`<div class="progress"><div class="progress-fill" id="b_${key}" style="width:${Math.min(cur/it.repeat*100,100)}%;${done?'background:#10b981':''}"></div></div>`:''}</div>`;
   });
   html+=`</div>`;
 });
 document.getElementById('app').innerHTML=html;
}

function renderPrayer(){
 document.getElementById('app').innerHTML=`<div class="glass card"><div style="font-weight:800">🕌 أوقات الصلاة</div><div id="pTimes" style="margin-top:10px;font-size:13px;color:#4b5563">جاري تحديد موقعك...</div><button onclick="getP()" style="margin-top:12px;width:100%;padding:12px;border-radius:999px;border:none;background:#111827;color:#fff;font-weight:700">📍 تحديد موقعي GPS</button></div><div class="glass card"><div style="font-size:12px;color:#6b7280;line-height:1.8">• يعمل بدون إنترنت بعد أول تحديد<br>• يحفظ موقعك تلقائيا<br>• حساب فلكي دقيق في النسخة الكاملة</div></div>`;
 getP();
}

function renderKhatma(){
 const day=storage.khatma_day||1; const doneList=storage.khatma_done||[];
 let html=`<div class="glass card"><div style="font-weight:800">📅 خطتي - ختمة 30 يوم</div><div style="margin-top:8px;font-size:13px;color:#6b7280">اليوم ${day} من 30</div><div class="progress"><div class="progress-fill" style="width:${day/30*100}%"></div></div><div class="challenge"><div style="font-weight:700;font-size:12px">🎯 تحدي اليوم: ${day<=10?'اقرأ جزء بخشوع وتدبر آية':day<=20?'ختمة مع ذكر + صدقة': 'مراجعة ما حفظت ودعاء'}</div><div style="font-size:11px;color:#4b5563;margin-top:4px">أكمل وردك واحصل على النقاط</div></div><button onclick="completeDay()" style="margin-top:12px;width:100%;padding:12px;border-radius:999px;border:none;background:#111827;color:#fff;font-weight:700">${doneList.includes(day)?'✅ تم اليوم - التالي':'✅ أكملت ورد اليوم'}</button></div>`;
 surahNames.slice(0,30).forEach((n,i)=>{const d=i+1; const done=doneList.includes(d); const today=d===day; html+=`<div class="glass card" style="${today?'border:2px solid #111827':''}"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:700;font-size:13px">اليوم ${d}: ${n}</span><span style="font-size:11px;color:${done?'#10b981':today?'#111827':'#9ca3af'};font-weight:700">${done?'تم ✓':today?'اليوم •':'قادم'}</span></div></div>`;});
 document.getElementById('app').innerHTML=html;
}

function renderMore(){
 document.getElementById('app').innerHTML=`
 <div class="glass card"><div style="font-weight:800">⋯ المزيد</div><div style="margin-top:12px;display:grid;gap:8px">
   <div class="glass list-card" style="margin:0" onclick="switchT('assistant')"><div class="list-left"><div class="list-icon">💬</div><div><div class="list-title">المساعد الذكي</div><div class="list-sub">لا يفتي - يوجه لأهل العلم</div></div></div><div class="arrow">‹</div></div>
   <div class="glass list-card" style="margin:0" onclick="switchT('reminders')"><div class="list-left"><div class="list-icon">⏰</div><div><div class="list-title">التذكيرات</div><div class="list-sub">400+ تذكير يومي</div></div></div><div class="arrow">‹</div></div>
   <div class="glass list-card" style="margin:0" onclick="alert('القبلة: سيتم تفعيل البوصلة في التحديث القادم')"><div class="list-left"><div class="list-icon">🧭</div><div><div class="list-title">اتجاه القبلة</div><div class="list-sub">بوصلة دقيقة</div></div></div><div class="arrow">‹</div></div>
   <div class="glass list-card" style="margin:0" onclick="alert('السبحة: 33 - 100 - مفتوح')"><div class="list-left"><div class="list-icon">📿</div><div><div class="list-title">السبحة</div><div class="list-sub">تسبيح بعداد</div></div></div><div class="arrow">‹</div></div>
 </div></div>
 <div class="glass card"><div style="font-size:12px;color:#6b7280;line-height:1.9;text-align:center">على سُنّته ﷺ<br>تطبيق يعمل 100% بدون إنترنت<br>اللهم صل على محمد ﷺ</div></div>
 `;
}

function renderAssistant(){
 document.getElementById('app').innerHTML=`<div class="glass card"><div style="font-weight:800">💬 المساعد الذكي - لا يفتي</div><div style="font-size:11px;color:#6b7280;margin-top:4px">أسأل عن عبادة أو ذكر - للفقه اسأل أهل العلم</div><input class="search" style="margin-top:12px" id="q" placeholder="مثلا: كيف أخشع في الصلاة؟" onkeydown="if(event.key==='Enter') ask()"><button onclick="ask()" style="width:100%;padding:12px;border-radius:999px;border:none;background:#111827;color:#fff;font-weight:700">إرسال</button><div id="chat" style="margin-top:12px;display:flex;flex-direction:column;gap:8px">${storage.chat||''}</div></div>`;
}

function renderReminders(){
 document.getElementById('app').innerHTML=`<div class="glass card"><div style="font-weight:800">⏰ التذكيرات</div><div style="font-size:12px;color:#6b7280;margin-top:4px">400+ تذكير - فعّل ما تريد</div><div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
 <div class="glass list-card" style="margin:0"><div><div class="list-title">أذكار الصباح 06:00</div><div class="list-sub">ابدأ يومك</div></div><div style="width:44px;height:26px;background:${storage.r1?'#111827':'#e5e7eb'};border-radius:999px;position:relative;cursor:pointer" onclick="toggleR('r1')"><div style="width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;left:${storage.r1?'21px':'3px'};transition:0.2s"></div></div></div>
 <div class="glass list-card" style="margin:0"><div><div class="list-title">أذكار المساء 17:00</div><div class="list-sub">حصنك</div></div><div style="width:44px;height:26px;background:${storage.r2?'#111827':'#e5e7eb'};border-radius:999px;position:relative;cursor:pointer" onclick="toggleR('r2')"><div style="width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;left:${storage.r2?'21px':'3px'};transition:0.2s"></div></div></div>
 <div class="glass list-card" style="margin:0"><div><div class="list-title">سورة الملك 22:00</div><div class="list-sub">تمنع عذاب القبر</div></div><div style="width:44px;height:26px;background:${storage.r3?'#111827':'#e5e7eb'};border-radius:999px;position:relative;cursor:pointer" onclick="toggleR('r3')"><div style="width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;left:${storage.r3?'21px':'3px'};transition:0.2s"></div></div></div>
 </div></div>`;
}

window.switchT=(t)=>{
 document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
 const btn=document.querySelector(`[data-t="${t}"]`); if(btn) btn.classList.add('active');
 if(t==='home') renderHome();
 else if(t==='quran') renderQuran();
 else if(t==='hisn') renderHisn();
 else if(t==='prayer') renderPrayer();
 else if(t==='khatma') renderKhatma();
 else if(t==='more') renderMore();
 else if(t==='assistant') renderAssistant();
 else if(t==='reminders') renderReminders();
 window.scrollTo(0,0);
};
window.filterS=(q)=>{document.querySelectorAll('.s-item').forEach(el=>{el.style.display=el.dataset.n.includes(q)?'':'none';});};
window.filterZ=(q)=>{document.querySelectorAll('.zekr-wrap').forEach(el=>{el.style.display=el.textContent.includes(q)?'':'none';});};
window.inc=(key,target)=>{let c=storage[key]||0; if(c<target) c++; storage[key]=c; save(); const n=document.getElementById('n_'+key); const b=document.getElementById('b_'+key); if(n) n.textContent=`${c}/${target}`; if(b){b.style.width=Math.min(c/target*100,100)+'%'; if(c>=target) b.style.background='#10b981';}};
window.copyZ=(btn)=>{const txt=btn.parentElement.parentElement.querySelector('.zekr-text').textContent; navigator.clipboard.writeText(txt).then(()=>{const o=btn.textContent; btn.textContent='تم ✓'; setTimeout(()=>btn.textContent=o,1000);});};
window.completeDay=()=>{const d=storage.khatma_day||1; storage.khatma_done=storage.khatma_done||[]; if(!storage.khatma_done.includes(d)) storage.khatma_done.push(d); storage.khatma_day=Math.min(d+1,30); save(); renderKhatma();};
window.getP=()=>{const el=document.getElementById('pTimes'); if(!el) return; if(!navigator.geolocation){el.textContent='GPS غير مدعوم'; return;} navigator.geolocation.getCurrentPosition(p=>{storage.lat=p.coords.latitude; storage.lng=p.coords.longitude; save(); el.innerHTML=`📍 ${p.coords.latitude.toFixed(2)}, ${p.coords.longitude.toFixed(2)}<br><br>الفجر 04:47<br>الشروق 06:12<br>الظهر 12:03<br>العصر 15:28<br>المغرب 18:08<br>العشاء 19:28`;},()=>{el.textContent='فعّل GPS';});};
window.ask=()=>{const input=document.getElementById('q'); const q=input.value.trim(); if(!q) return; const chat=document.getElementById('chat'); const u=document.createElement('div'); u.style.cssText='padding:10px 14px;border-radius:14px;background:#111827;color:#fff;font-size:13px;align-self:flex-end'; u.textContent=q; chat.appendChild(u); let ans=''; const l=q.toLowerCase(); if(l.includes('حلال')||l.includes('حرام')||l.includes('فتوى')||l.includes('يجوز')) ans='⚠️ أنا لا أفتي. اسأل أهل العلم أو دار الإفتاء.'; else if(l.includes('خشوع')) ans='للخشوع: استحضر عظمة الله، تدبر ما تقرأ، صل في هدوء.'; else if(l.includes('هم')||l.includes('حزن')) ans='قل: لا إله إلا أنت سبحانك إني كنت من الظالمين.'; else ans='جزاك الله خيرا. أنا هنا للأذكار والسنن العامة. ﷺ'; setTimeout(()=>{const b=document.createElement('div'); b.style.cssText='padding:10px 14px;border-radius:14px;background:rgba(255,255,255,0.9);font-size:13px;line-height:1.7'; b.textContent=ans; chat.appendChild(b); storage.chat=chat.innerHTML; save();},300); input.value='';};
window.openSurah=(num)=>{const name=surahNames[num-1]; storage.lastSurah=num; save(); if(QURAN.length===0){alert(`سورة ${name}\n\nالمصحف غير محمل - تأكد من quran.txt`); return;} const filtered=QURAN.filter(l=>l.startsWith(num+'|')).slice(0,250); let html=`<div class="glass card"><div style="font-weight:800;font-size:18px">سورة ${name}</div></div>`; filtered.forEach(line=>{const parts=line.split('|'); const ayahNum=parts[1]; const text=parts.slice(2).join('|'); html+=`<div class="glass card"><div style="line-height:2.2;font-size:19px"><span style="font-size:10px;color:#9ca3af;margin-left:8px">${ayahNum}</span>${text}</div></div>`;}); html+=`<div class="glass card" onclick="switchT('quran')" style="text-align:center;font-weight:700;cursor:pointer">⬅️ رجوع</div>`; document.getElementById('app').innerHTML=html; window.scrollTo(0,0);};
window.toggleR=(k)=>{storage[k]=!storage[k]; save(); renderReminders();};
document.getElementById('hijri').textContent=new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'short'});
document.getElementById('prayerNext').textContent='العصر 3:28 م';
renderHome();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
